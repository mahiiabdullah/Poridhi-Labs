<svg viewBox="0 38 1200 582" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Opaque background so GitHub dark themes do not show through -->
  <rect x="0" y="38" width="1200" height="582" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e36209"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <!-- ============ CLIENT ============ -->
  <rect x="20" y="263" width="110" height="110" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="75.0" y="287" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client</text>
  <text x="75.0" y="307" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">curl</text>
  <text x="75.0" y="324" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">smoke.sh</text>
  <g transform="translate(75,351)" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-11" y="-8" width="22" height="16" rx="3"/>
    <path d="M-6,-3 L-2,0 L-6,3"/>
    <line x1="1" y1="3" x2="6" y2="3"/>
  </g>

  <!-- ============ COMPOSE BOUNDARY ============ -->
  <rect x="185" y="75" width="1000" height="520" rx="14" ry="14" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <rect x="201" y="63" width="190" height="24" rx="6" ry="6" fill="#666666" stroke="none"/>
  <text x="296.0" y="79" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">docker compose</text>

  <!-- ============ SERVICES ============ -->
  <rect x="240" y="265" width="220" height="110" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="350.0" y="289" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">order-service</text>
  <text x="350.0" y="309" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">:3003</text>
  <text x="350.0" y="326" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">HTTP clients for users, products</text>
  <rect x="640" y="100" width="220" height="100" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="750.0" y="124" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">user-service</text>
  <text x="750.0" y="144" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">:3001</text>
  <text x="750.0" y="161" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">GET /users/:id</text>
  <rect x="640" y="440" width="220" height="100" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="750.0" y="464" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">product-service</text>
  <text x="750.0" y="484" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">:3002</text>
  <text x="750.0" y="501" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">POST /products/:id/reserve</text>

  <!-- ============ DATABASES ============ -->
  <rect x="950" y="100" width="200" height="100" rx="10" ry="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="1050.0" y="124" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">users DB</text>
  <text x="1050.0" y="144" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">user-db</text>
  <text x="1050.0" y="161" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">PostgreSQL 16</text>
  <g transform="translate(1050,185)" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="-8" rx="10" ry="4"/>
    <path d="M-10,-8 V8 A10,4 0 0 0 10,8 V-8"/>
    <path d="M-10,0 A10,4 0 0 0 10,0"/>
  </g>
  <rect x="950" y="440" width="200" height="100" rx="10" ry="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="1050.0" y="464" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">products DB</text>
  <text x="1050.0" y="484" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">product-db</text>
  <text x="1050.0" y="501" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">PostgreSQL 16</text>
  <g transform="translate(1050,525)" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="-8" rx="10" ry="4"/>
    <path d="M-10,-8 V8 A10,4 0 0 0 10,8 V-8"/>
    <path d="M-10,0 A10,4 0 0 0 10,0"/>
  </g>
  <rect x="240" y="440" width="220" height="100" rx="10" ry="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="350.0" y="464" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">orders DB</text>
  <text x="350.0" y="484" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">order-db</text>
  <text x="350.0" y="501" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">no foreign keys</text>
  <g transform="translate(350,525)" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="-8" rx="10" ry="4"/>
    <path d="M-10,-8 V8 A10,4 0 0 0 10,8 V-8"/>
    <path d="M-10,0 A10,4 0 0 0 10,0"/>
  </g>

  <!-- ============ ANIMATED ARROWS ============ -->
  <path d="M 130,318 H 240" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/></path>
  <rect x="146" y="297.5" width="79" height="15.5" rx="3" ry="3" fill="#f5f5f5" stroke="none"/>
  <text x="185" y="308" font-size="10.5" font-weight="400" fill="#444444" text-anchor="middle">POST /orders</text>
  <path d="M 460,300 H 560 V 150 H 640" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" values="14;0" dur="1.2s" repeatCount="indefinite"/></path>
  <rect x="566" y="224.5" width="90" height="15.5" rx="3" ry="3" fill="#f5f5f5" stroke="none"/>
  <text x="570" y="235" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">GET /users/:id</text>
  <path d="M 460,345 H 560 V 490 H 640" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" values="14;0" dur="1.2s" repeatCount="indefinite"/></path>
  <rect x="566" y="394.5" width="108" height="15.5" rx="3" ry="3" fill="#f5f5f5" stroke="none"/>
  <text x="570" y="405" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">GET /products/:id</text>
  <rect x="566" y="410.5" width="161" height="15.5" rx="3" ry="3" fill="#f5f5f5" stroke="none"/>
  <text x="570" y="421" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">POST /products/:id/reserve</text>
  <path d="M 350,375 V 440" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/></path>
  <text x="362" y="410" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">SQL</text>
  <path d="M 860,150 H 950" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/></path>
  <rect x="892" y="129.5" width="26" height="15.5" rx="3" ry="3" fill="#f5f5f5" stroke="none"/>
  <text x="905" y="140" font-size="10.5" font-weight="400" fill="#444444" text-anchor="middle">SQL</text>
  <path d="M 860,490 H 950" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/></path>
  <rect x="892" y="469.5" width="26" height="15.5" rx="3" ry="3" fill="#f5f5f5" stroke="none"/>
  <text x="905" y="480" font-size="10.5" font-weight="400" fill="#444444" text-anchor="middle">SQL</text>
</svg>
