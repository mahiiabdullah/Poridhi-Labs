<svg viewBox="0 63 1200 462" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Opaque background so GitHub dark themes do not show through -->
  <rect x="0" y="63" width="1200" height="462" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e36209"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <!-- ============ CLIENT ============ -->
  <rect x="30" y="215" width="130" height="110" rx="10" ry="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="95.0" y="239" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client</text>
  <text x="95.0" y="259" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">curl / smoke.sh</text>
  <text x="95.0" y="276" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">unit test</text>
  <g transform="translate(95,303)" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-11" y="-8" width="22" height="16" rx="3"/>
    <path d="M-6,-3 L-2,0 L-6,3"/>
    <line x1="1" y1="3" x2="6" y2="3"/>
  </g>

  <!-- ============ APP CONTAINER ============ -->
  <rect x="215" y="100" width="740" height="400" rx="14" ry="14" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <rect x="231" y="88" width="230" height="24" rx="6" ry="6" fill="#666666" stroke="none"/>
  <text x="346.0" y="104" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">shop-app · Node 20 + Express</text>
  <rect x="290" y="130" width="560" height="56" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="570.0" y="154" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">container.js</text>
  <text x="570" y="171" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">composition root: builds every layer and injects its dependencies</text>
  <rect x="245" y="215" width="170" height="110" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="330.0" y="239" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Controllers</text>
  <text x="330.0" y="259" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">user · product · order</text>
  <text x="330.0" y="276" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">HTTP in, HTTP out</text>
  <rect x="475" y="215" width="170" height="110" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="560.0" y="239" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Services</text>
  <text x="560.0" y="259" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">business rules</text>
  <text x="560.0" y="276" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">stock check, totals</text>
  <rect x="705" y="215" width="170" height="110" rx="10" ry="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="790.0" y="239" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Repositories</text>
  <text x="790.0" y="259" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">SQL only</text>
  <text x="790.0" y="276" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">one per table</text>

  <!-- ============ DATABASE ============ -->
  <rect x="990" y="215" width="170" height="110" rx="10" ry="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="1075.0" y="239" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">PostgreSQL 16</text>
  <text x="1075.0" y="259" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">shop-db</text>
  <text x="1075.0" y="276" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">shop database</text>
  <g transform="translate(1075,305)" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="-8" rx="10" ry="4"/>
    <path d="M-10,-8 V8 A10,4 0 0 0 10,8 V-8"/>
    <path d="M-10,0 A10,4 0 0 0 10,0"/>
  </g>

  <!-- ============ UNIT TEST ============ -->
  <rect x="430" y="395" width="280" height="70" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="570.0" y="419" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Unit test</text>
  <text x="570.0" y="439" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">services run against fake repositories</text>
  <text x="570.0" y="456" font-size="11.5" font-weight="400" fill="#666666" text-anchor="middle">no database needed</text>

  <!-- ============ WIRING (injection) ============ -->
  <path d="M 330,186 V 215" fill="none" stroke="#888888" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-grey)"><animate attributeName="stroke-dashoffset" values="14;0" dur="0.6s" repeatCount="indefinite"/></path>
  <path d="M 560,186 V 215" fill="none" stroke="#888888" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-grey)"><animate attributeName="stroke-dashoffset" values="14;0" dur="0.6s" repeatCount="indefinite"/></path>
  <path d="M 790,186 V 215" fill="none" stroke="#888888" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-grey)"><animate attributeName="stroke-dashoffset" values="14;0" dur="0.6s" repeatCount="indefinite"/></path>
  <text x="398" y="205" font-size="10.5" font-weight="400" fill="#888888" text-anchor="start">injects</text>

  <!-- ============ ANIMATED ARROWS ============ -->
  <path d="M 160,260 H 245" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/></path>
  <rect x="169" y="239.5" width="67" height="15.5" rx="3" ry="3" fill="#ffffff" stroke="none"/>
  <text x="202" y="250" font-size="10.5" font-weight="400" fill="#444444" text-anchor="middle">HTTP :3100</text>
  <path d="M 415,260 H 475" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/></path>
  <rect x="426" y="239.5" width="37" height="15.5" rx="3" ry="3" fill="#f5f5f5" stroke="none"/>
  <text x="445" y="250" font-size="10.5" font-weight="400" fill="#444444" text-anchor="middle">calls</text>
  <path d="M 645,260 H 705" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/></path>
  <rect x="650" y="239.5" width="49" height="15.5" rx="3" ry="3" fill="#f5f5f5" stroke="none"/>
  <text x="675" y="250" font-size="10.5" font-weight="400" fill="#444444" text-anchor="middle">queries</text>
  <path d="M 875,260 H 990" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/></path>
  <rect x="919" y="239.5" width="26" height="15.5" rx="3" ry="3" fill="#f5f5f5" stroke="none"/>
  <text x="932" y="250" font-size="10.5" font-weight="400" fill="#444444" text-anchor="middle">SQL</text>
  <path d="M 560,395 V 325" fill="none" stroke="#888888" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-grey)"><animate attributeName="stroke-dashoffset" values="14;0" dur="0.6s" repeatCount="indefinite"/></path>
  <text x="576" y="365" font-size="10.5" font-weight="400" fill="#888888" text-anchor="start">fakes injected</text>
</svg>
