<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="680" fill="#fafafa"/>

  <!-- AWS Cloud -->
  <rect x="60" y="60" width="1080" height="540" rx="14" ry="14" fill="#fff4e6" stroke="#f58534" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="80" y="92" font-size="18" font-weight="700" fill="#232f3e">AWS Cloud</text>

  <!-- VPC -->
  <rect x="100" y="120" width="1000" height="460" rx="12" ry="12" fill="#ffffff" stroke="#7d8998" stroke-width="2"/>
  <text x="120" y="148" font-size="16" font-weight="700" fill="#232f3e">VPC 10.0.0.0/16</text>

  <!-- Public Subnet -->
  <rect x="140" y="170" width="920" height="380" rx="10" ry="10" fill="#eef6ff" stroke="#3b73af" stroke-width="1.5"/>
  <text x="160" y="196" font-size="14" font-weight="600" fill="#1f4e79">Public Subnet 10.0.1.0/24  (us-east-1a)</text>

  <!-- Cluster overlay -->
  <g>
    <rect x="170" y="220" width="760" height="320" rx="10" ry="10" fill="none" stroke="#7d8998" stroke-width="2" stroke-dasharray="8,4"/>
    <rect x="180" y="222" width="240" height="22" fill="#7d8998"/>
    <text x="188" y="238" font-size="12" font-weight="700" fill="#ffffff">cluster.name: docker-cluster</text>
    <text x="430" y="238" font-size="11" fill="#7d8998">cluster.initial_master_nodes: [es-master]</text>
    <text x="780" y="238" font-size="11" fill="#7d8998">discovery.seed_hosts: private IPs</text>
  </g>

  <!-- Security Group -->
  <g>
    <rect x="180" y="258" width="740" height="276" rx="10" ry="10" fill="none" stroke="#dd344c" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="190" y="260" width="120" height="20" fill="#dd344c"/>
    <text x="198" y="276" font-size="12" font-weight="700" fill="#ffffff">es-cluster-sg</text>
    <text x="198" y="294" font-size="10" fill="#7d8998">22 · 9200 · 9300/tcp (self + operator CIDR)</text>
  </g>

  <!-- es-master -->
  <g>
    <rect x="210" y="320" width="220" height="200" rx="10" ry="10" fill="#ffffff" stroke="#dd344c" stroke-width="2"/>
    <rect x="218" y="324" width="204" height="22" rx="4" ry="4" fill="#dd344c"/>
    <text x="320" y="340" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">es-master</text>
    <text x="320" y="362" font-size="11" text-anchor="middle" fill="#232f3e">node.roles: [ master ]</text>
    <rect x="220" y="372" width="200" height="56" rx="4" ry="4" fill="#fce8ec" stroke="#dd344c" stroke-width="1"/>
    <text x="320" y="392" font-size="11" text-anchor="middle" fill="#232f3e">t3.medium · Ubuntu 24.04</text>
    <text x="320" y="409" font-size="11" text-anchor="middle" fill="#232f3e">10.0.1.10 · 54.0.0.10</text>
    <rect x="220" y="436" width="200" height="72" rx="4" ry="4" fill="#eef6ff" stroke="#3b73af" stroke-width="1"/>
    <text x="320" y="456" font-size="11" text-anchor="middle" fill="#1f4e79">Elasticsearch 8.x</text>
    <text x="320" y="472" font-size="11" text-anchor="middle" fill="#1f4e79">/etc/elasticsearch/</text>
    <text x="320" y="488" font-size="11" text-anchor="middle" fill="#1f4e79">elasticsearch.yml</text>
    <text x="320" y="504" font-size="11" text-anchor="middle" fill="#1f4e79">systemd: restarted</text>
  </g>

  <!-- es-data-1 -->
  <g>
    <rect x="460" y="320" width="220" height="200" rx="10" ry="10" fill="#ffffff" stroke="#1d8102" stroke-width="2"/>
    <rect x="468" y="324" width="204" height="22" rx="4" ry="4" fill="#1d8102"/>
    <text x="570" y="340" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">es-data-1</text>
    <text x="570" y="362" font-size="11" text-anchor="middle" fill="#232f3e">node.roles: [ data ]</text>
    <rect x="470" y="372" width="200" height="56" rx="4" ry="4" fill="#e6f4e1" stroke="#1d8102" stroke-width="1"/>
    <text x="570" y="392" font-size="11" text-anchor="middle" fill="#232f3e">t3.medium · Ubuntu 24.04</text>
    <text x="570" y="409" font-size="11" text-anchor="middle" fill="#232f3e">10.0.1.11 · 54.0.0.11</text>
    <rect x="470" y="436" width="200" height="72" rx="4" ry="4" fill="#eef6ff" stroke="#3b73af" stroke-width="1"/>
    <text x="570" y="456" font-size="11" text-anchor="middle" fill="#1f4e79">Elasticsearch 8.x</text>
    <text x="570" y="472" font-size="11" text-anchor="middle" fill="#1f4e79">/etc/elasticsearch/</text>
    <text x="570" y="488" font-size="11" text-anchor="middle" fill="#1f4e79">elasticsearch.yml</text>
    <text x="570" y="504" font-size="11" text-anchor="middle" fill="#1f4e79">systemd: restarted</text>
  </g>

  <!-- es-data-2 -->
  <g>
    <rect x="710" y="320" width="220" height="200" rx="10" ry="10" fill="#ffffff" stroke="#1d8102" stroke-width="2"/>
    <rect x="718" y="324" width="204" height="22" rx="4" ry="4" fill="#1d8102"/>
    <text x="820" y="340" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">es-data-2</text>
    <text x="820" y="362" font-size="11" text-anchor="middle" fill="#232f3e">node.roles: [ data, ingest ]</text>
    <rect x="720" y="372" width="200" height="56" rx="4" ry="4" fill="#e6f4e1" stroke="#1d8102" stroke-width="1"/>
    <text x="820" y="392" font-size="11" text-anchor="middle" fill="#232f3e">t3.medium · Ubuntu 24.04</text>
    <text x="820" y="409" font-size="11" text-anchor="middle" fill="#232f3e">10.0.1.12 · 54.0.0.12</text>
    <rect x="720" y="436" width="200" height="72" rx="4" ry="4" fill="#eef6ff" stroke="#3b73af" stroke-width="1"/>
    <text x="820" y="456" font-size="11" text-anchor="middle" fill="#1f4e79">Elasticsearch 8.x</text>
    <text x="820" y="472" font-size="11" text-anchor="middle" fill="#1f4e79">/etc/elasticsearch/</text>
    <text x="820" y="488" font-size="11" text-anchor="middle" fill="#1f4e79">elasticsearch.yml</text>
    <text x="820" y="504" font-size="11" text-anchor="middle" fill="#1f4e79">systemd: restarted</text>
  </g>

  <!-- Discovery arrows (9300 transport) between nodes -->
  <g stroke="#3b73af" stroke-width="1.8" fill="none" marker-end="url(#arrowLab50)" marker-start="url(#arrowLab50Start)">
    <line x1="430" y1="420" x2="460" y2="420"/>
    <line x1="680" y1="420" x2="710" y2="420"/>
    <line x1="570" y1="520" x2="570" y2="540" stroke-dasharray="3,3"/>
    <line x1="320" y1="520" x2="320" y2="540" stroke-dasharray="3,3"/>
    <line x1="820" y1="520" x2="820" y2="540" stroke-dasharray="3,3"/>
  </g>
  <text x="320" y="558" font-size="10" text-anchor="middle" fill="#1f4e79">9300</text>
  <text x="570" y="558" font-size="10" text-anchor="middle" fill="#1f4e79">9300</text>
  <text x="820" y="558" font-size="10" text-anchor="middle" fill="#1f4e79">9300</text>

  <!-- Operator / laptop -->
  <g>
    <rect x="20" y="320" width="120" height="80" rx="8" ry="8" fill="#ffffff" stroke="#232f3e" stroke-width="1.5"/>
    <text x="80" y="348" font-size="12" font-weight="700" text-anchor="middle" fill="#232f3e">Operator</text>
    <text x="80" y="366" font-size="11" text-anchor="middle" fill="#232f3e">scp + sudo tee</text>
    <text x="80" y="382" font-size="11" text-anchor="middle" fill="#232f3e">es-lab-key.pem</text>
  </g>
  <line x1="140" y1="360" x2="210" y2="360" stroke="#3b73af" stroke-width="1.5" marker-end="url(#arrowLab50)"/>
  <text x="172" y="352" font-size="10" text-anchor="middle" fill="#1f4e79">22</text>

  <!-- Verifies panel -->
  <g>
    <rect x="940" y="220" width="140" height="60" rx="8" ry="8" fill="#ffffff" stroke="#3b73af" stroke-width="1.5"/>
    <text x="1010" y="242" font-size="12" font-weight="700" text-anchor="middle" fill="#1f4e79">curl :9200</text>
    <text x="1010" y="258" font-size="11" text-anchor="middle" fill="#1f4e79">_cat/nodes</text>
    <text x="1010" y="274" font-size="11" text-anchor="middle" fill="#1f4e79">cluster health</text>
  </g>
  <line x1="940" y1="380" x2="930" y2="420" stroke="#3b73af" stroke-width="1.5" marker-end="url(#arrowLab50)"/>
  <text x="935" y="404" font-size="10" fill="#1f4e79">9200</text>

  <!-- Footer note -->
  <text x="120" y="640" font-size="11" fill="#7d8998">Lab 50: edit /etc/elasticsearch/elasticsearch.yml on each instance, restart systemd unit, verify via _cat/nodes + _cluster/health.</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowLab50" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3b73af"/>
    </marker>
    <marker id="arrowLab50Start" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#3b73af"/>
    </marker>
  </defs>
</svg>
