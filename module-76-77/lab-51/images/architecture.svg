<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>
  <rect x="10" y="10" width="980" height="460" rx="10" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Docker Compose boundary -->
  <rect x="350" y="100" width="580" height="290" rx="16" fill="none" stroke="#aaaaaa" stroke-width="1.4" stroke-dasharray="6,5"/>
  <text x="372" y="124" font-size="12" fill="#999999">Docker Compose</text>

  <!-- Client -->
  <rect x="60" y="175" width="210" height="150" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <g transform="translate(165,232)">
    <rect x="-42" y="-30" width="84" height="60" rx="6" fill="#2b2b2b"/>
    <path d="M-26,-6 L-9,0 L-26,6" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-3" y1="6" x2="18" y2="6" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <text x="165" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">curl / Browser</text>
  <text x="165" y="318" text-anchor="middle" font-size="11" fill="#666666">/index &#183; /search</text>

  <!-- Flask API -->
  <rect x="390" y="175" width="220" height="150" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <g transform="translate(500,232)">
    <path d="M-13,-24 L-13,-4 L-27,22 A6,6 0 0 0 -21,30 L21,30 A6,6 0 0 0 27,22 L13,-4 L13,-24 Z" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linejoin="round"/>
    <line x1="-16" y1="-24" x2="16" y2="-24" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text x="500" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Flask API</text>
  <text x="500" y="318" text-anchor="middle" font-size="11" fill="#666666">lab51-web &#183; :5000</text>

  <!-- Elasticsearch -->
  <rect x="720" y="175" width="190" height="150" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <g transform="translate(815,232)">
    <circle cx="-6" cy="-6" r="14" fill="none" stroke="#fec514" stroke-width="4"/>
    <line x1="5" y1="5" x2="18" y2="18" stroke="#fec514" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="815" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Elasticsearch</text>
  <text x="815" y="318" text-anchor="middle" font-size="11" fill="#666666">lab51-elasticsearch &#183; :9200</text>

  <!-- Client -> Flask -->
  <line x1="270" y1="250" x2="386" y2="250" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <text x="328" y="238" text-anchor="middle" font-size="11" fill="#444444">HTTP :5000</text>

  <!-- Flask -> Elasticsearch (request) -->
  <line x1="610" y1="244" x2="712" y2="244" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <!-- Elasticsearch -> Flask (results) -->
  <line x1="712" y1="262" x2="610" y2="262" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8,6" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <text x="661" y="226" text-anchor="middle" font-size="10.5" fill="#444444">elasticsearch-py</text>

</svg>
