<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="640" fill="#fafafa"/>

  <!-- AWS Cloud -->
  <rect x="60" y="60" width="1080" height="500" rx="14" ry="14" fill="#fff4e6" stroke="#f58534" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="80" y="92" font-size="18" font-weight="700" fill="#232f3e">AWS Cloud</text>

  <!-- VPC -->
  <rect x="100" y="120" width="1000" height="420" rx="12" ry="12" fill="#ffffff" stroke="#7d8998" stroke-width="2"/>
  <text x="120" y="148" font-size="16" font-weight="700" fill="#232f3e">VPC 10.0.0.0/16</text>

  <!-- Public Subnet -->
  <rect x="140" y="170" width="920" height="340" rx="10" ry="10" fill="#eef6ff" stroke="#3b73af" stroke-width="1.5"/>
  <text x="160" y="196" font-size="14" font-weight="600" fill="#1f4e79">Public Subnet 10.0.1.0/24  (us-east-1a)</text>

  <!-- Internet Gateway -->
  <g>
    <rect x="1080" y="200" width="50" height="50" rx="6" ry="6" fill="#ffffff" stroke="#3b73af" stroke-width="1.5"/>
    <text x="1105" y="232" font-size="11" text-anchor="middle" fill="#1f4e79">IGW</text>
  </g>
  <line x1="1075" y1="225" x2="1060" y2="225" stroke="#3b73af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1067" y="218" font-size="10" fill="#1f4e79">0.0.0.0/0</text>

  <!-- Route Table -->
  <g>
    <rect x="900" y="180" width="140" height="60" rx="6" ry="6" fill="#ffffff" stroke="#7d8998" stroke-width="1.5"/>
    <text x="970" y="202" font-size="12" font-weight="700" text-anchor="middle" fill="#232f3e">Route Table</text>
    <text x="970" y="222" font-size="11" text-anchor="middle" fill="#232f3e">local + IGW</text>
  </g>
  <line x1="900" y1="210" x2="1060" y2="210" stroke="#7d8998" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Security Group -->
  <g>
    <rect x="160" y="220" width="740" height="280" rx="10" ry="10" fill="none" stroke="#dd344c" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="170" y="222" width="120" height="20" fill="#dd344c"/>
    <text x="178" y="238" font-size="12" font-weight="700" fill="#ffffff">es-cluster-sg</text>
    <text x="178" y="258" font-size="10" fill="#7d8998">22/tcp (SSH)   9200/tcp   9300/tcp</text>
  </g>

  <!-- EC2 Instances -->
  <!-- es-master -->
  <g>
    <rect x="200" y="290" width="200" height="180" rx="10" ry="10" fill="#ffffff" stroke="#dd344c" stroke-width="2"/>
    <text x="300" y="312" font-size="14" font-weight="700" text-anchor="middle" fill="#232f3e">es-master</text>
    <rect x="210" y="322" width="180" height="60" rx="4" ry="4" fill="#fce8ec" stroke="#dd344c" stroke-width="1"/>
    <text x="300" y="345" font-size="11" text-anchor="middle" fill="#232f3e">t3.medium  Ubuntu 24.04</text>
    <text x="300" y="362" font-size="11" text-anchor="middle" fill="#232f3e">2 vCPU · 4 GB RAM</text>
    <text x="300" y="378" font-size="11" text-anchor="middle" fill="#232f3e">10 GB gp3</text>
    <rect x="210" y="392" width="180" height="60" rx="4" ry="4" fill="#eef6ff" stroke="#3b73af" stroke-width="1"/>
    <text x="300" y="412" font-size="11" text-anchor="middle" fill="#1f4e79">Elasticsearch 8.x</text>
    <text x="300" y="428" font-size="11" text-anchor="middle" fill="#1f4e79">JVM heap 512m</text>
    <text x="300" y="444" font-size="11" text-anchor="middle" fill="#1f4e79">systemd service</text>
  </g>

  <!-- es-data-1 -->
  <g>
    <rect x="430" y="290" width="200" height="180" rx="10" ry="10" fill="#ffffff" stroke="#1d8102" stroke-width="2"/>
    <text x="530" y="312" font-size="14" font-weight="700" text-anchor="middle" fill="#232f3e">es-data-1</text>
    <rect x="440" y="322" width="180" height="60" rx="4" ry="4" fill="#e6f4e1" stroke="#1d8102" stroke-width="1"/>
    <text x="530" y="345" font-size="11" text-anchor="middle" fill="#232f3e">t3.medium  Ubuntu 24.04</text>
    <text x="530" y="362" font-size="11" text-anchor="middle" fill="#232f3e">2 vCPU · 4 GB RAM</text>
    <text x="530" y="378" font-size="11" text-anchor="middle" fill="#232f3e">10 GB gp3</text>
    <rect x="440" y="392" width="180" height="60" rx="4" ry="4" fill="#eef6ff" stroke="#3b73af" stroke-width="1"/>
    <text x="530" y="412" font-size="11" text-anchor="middle" fill="#1f4e79">Elasticsearch 8.x</text>
    <text x="530" y="428" font-size="11" text-anchor="middle" fill="#1f4e79">JVM heap 512m</text>
    <text x="530" y="444" font-size="11" text-anchor="middle" fill="#1f4e79">systemd service</text>
  </g>

  <!-- es-data-2 -->
  <g>
    <rect x="660" y="290" width="200" height="180" rx="10" ry="10" fill="#ffffff" stroke="#1d8102" stroke-width="2"/>
    <text x="760" y="312" font-size="14" font-weight="700" text-anchor="middle" fill="#232f3e">es-data-2</text>
    <rect x="670" y="322" width="180" height="60" rx="4" ry="4" fill="#e6f4e1" stroke="#1d8102" stroke-width="1"/>
    <text x="760" y="345" font-size="11" text-anchor="middle" fill="#232f3e">t3.medium  Ubuntu 24.04</text>
    <text x="760" y="362" font-size="11" text-anchor="middle" fill="#232f3e">2 vCPU · 4 GB RAM</text>
    <text x="760" y="378" font-size="11" text-anchor="middle" fill="#232f3e">10 GB gp3</text>
    <rect x="670" y="392" width="180" height="60" rx="4" ry="4" fill="#eef6ff" stroke="#3b73af" stroke-width="1"/>
    <text x="760" y="412" font-size="11" text-anchor="middle" fill="#1f4e79">Elasticsearch 8.x</text>
    <text x="760" y="428" font-size="11" text-anchor="middle" fill="#1f4e79">JVM heap 512m</text>
    <text x="760" y="444" font-size="11" text-anchor="middle" fill="#1f4e79">systemd service</text>
  </g>

  <!-- Public IP labels above instances -->
  <text x="300" y="276" font-size="11" text-anchor="middle" fill="#7d8998">54.0.0.10 (public)</text>
  <text x="530" y="276" font-size="11" text-anchor="middle" fill="#7d8998">54.0.0.11 (public)</text>
  <text x="760" y="276" font-size="11" text-anchor="middle" fill="#7d8998">54.0.0.12 (public)</text>

  <!-- Operator / laptop -->
  <g>
    <rect x="20" y="290" width="120" height="80" rx="8" ry="8" fill="#ffffff" stroke="#232f3e" stroke-width="1.5"/>
    <text x="80" y="318" font-size="12" font-weight="700" text-anchor="middle" fill="#232f3e">Operator</text>
    <text x="80" y="336" font-size="11" text-anchor="middle" fill="#232f3e">AWS CLI · SSH</text>
    <text x="80" y="352" font-size="11" text-anchor="middle" fill="#232f3e">es-lab-key.pem</text>
  </g>
  <line x1="140" y1="380" x2="200" y2="380" stroke="#3b73af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="372" font-size="10" text-anchor="middle" fill="#1f4e79">22/tcp</text>

  <!-- Key pair callout -->
  <g>
    <rect x="160" y="540" width="740" height="60" rx="8" ry="8" fill="#fff4e6" stroke="#f58534" stroke-width="1.5"/>
    <text x="180" y="562" font-size="12" font-weight="700" fill="#232f3e">Key pair: es-lab-key</text>
    <text x="180" y="580" font-size="11" fill="#232f3e">Injected at launch via --key-name. Used by SSH from the operator workstation to all three instances.</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3b73af"/>
    </marker>
  </defs>
</svg>
