<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1400" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>

    <!-- Animated dash flow -->
    <style>
      .flow {
        stroke-dasharray: 8 6;
        animation: dash 1.2s linear infinite;
      }
      @keyframes dash {
        from { stroke-dashoffset: 0; }
        to   { stroke-dashoffset: -28; }
      }
    </style>
  </defs>

  <!-- ============================================ -->
  <!-- CLIENT: Postman -->
  <!-- ============================================ -->
  <g transform="translate(80, 270)">
    <rect width="170" height="160" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <!-- Postman astronaut logo -->
    <g transform="translate(45, 16)">
      <circle cx="40" cy="40" r="40" fill="#ff6c37"/>
      <ellipse cx="48" cy="30" rx="11" ry="14" fill="#ffffff"/>
      <circle cx="44" cy="28" r="5" fill="#ff6c37"/>
      <rect x="18" y="48" width="50" height="10" rx="3" fill="#ffffff"/>
      <path d="M 50 50 L 90 64 L 60 70 L 64 90 L 50 78 Z" fill="#ffffff"/>
      <circle cx="50" cy="58" r="2.5" fill="#ff6c37"/>
    </g>
    <text x="85" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Postman</text>
    <text x="85" y="146" text-anchor="middle" font-size="11" fill="#6b7280">HTTP Client</text>
  </g>

  <!-- ============================================ -->
  <!-- API SERVER: Flask API -->
  <!-- ============================================ -->
  <g transform="translate(470, 220)">
    <rect width="260" height="200" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

    <!-- Flask flask icon -->
    <g transform="translate(105, 22)">
      <path d="M 30 8 Q 32 8 32 11 L 30 24 L 18 24 L 16 11 Q 16 8 18 8 Z" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round"/>
      <line x1="22" y1="15" x2="26" y2="15" stroke="#111827" stroke-width="2.4"/>
      <path d="M 18 26 Q 6 36 6 46 Q 6 58 24 58 Q 42 58 42 46 Q 42 36 30 26 Z" fill="none" stroke="#111827" stroke-width="2.4" stroke-linejoin="round"/>
      <line x1="14" y1="42" x2="34" y2="42" stroke="#111827" stroke-width="2.4"/>
    </g>

    <text x="130" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Flask API</text>
    <text x="130" y="144" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#6b7280">POST /tasks</text>
    <rect x="86" y="158" width="88" height="24" rx="12" fill="#eef2ff"/>
    <text x="130" y="174" text-anchor="middle" font-size="11" font-weight="700" fill="#4f46e5">PYTHON</text>
  </g>

  <!-- ============================================ -->
  <!-- BACKGROUND EXECUTION BOUNDARY -->
  <!-- ============================================ -->
  <g>
    <rect x="880" y="160" width="430" height="400" rx="18" fill="#fafafa" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="8 4"/>
    <rect x="880" y="160" width="200" height="30" rx="15" fill="#111827"/>
    <text x="980" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Background Execution</text>
  </g>

  <!-- ============================================ -->
  <!-- BACKGROUND TASK -->
  <!-- ============================================ -->
  <g transform="translate(910, 220)">
    <rect width="190" height="130" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <g transform="translate(75, 22)">
      <circle cx="20" cy="0" r="6" fill="#111827"/>
      <circle cx="0" cy="20" r="6" fill="#111827"/>
      <circle cx="40" cy="20" r="6" fill="#111827"/>
      <circle cx="20" cy="40" r="6" fill="#111827"/>
      <line x1="17" y1="4" x2="4" y2="17" stroke="#111827" stroke-width="2"/>
      <line x1="23" y1="4" x2="36" y2="17" stroke="#111827" stroke-width="2"/>
      <line x1="6" y1="23" x2="17" y2="37" stroke="#111827" stroke-width="2"/>
      <line x1="34" y1="23" x2="23" y2="37" stroke="#111827" stroke-width="2"/>
    </g>
    <text x="95" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Background Task</text>
    <text x="95" y="112" text-anchor="middle" font-size="11" fill="#6b7280">Runs independently</text>
  </g>

  <!-- ============================================ -->
  <!-- TASK PROCESSING -->
  <!-- ============================================ -->
  <g transform="translate(1130, 220)">
    <rect width="160" height="130" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <g transform="translate(60, 22)">
      <circle cx="20" cy="20" r="14" fill="#111827"/>
      <circle cx="20" cy="20" r="6" fill="#ffffff"/>
      <g fill="#111827">
        <rect x="18" y="0" width="4" height="8" rx="1"/>
        <rect x="18" y="32" width="4" height="8" rx="1"/>
        <rect x="0" y="18" width="8" height="4" rx="1"/>
        <rect x="32" y="18" width="8" height="4" rx="1"/>
        <rect x="6" y="6" width="4" height="8" rx="1" transform="rotate(45 8 10)"/>
        <rect x="30" y="6" width="4" height="8" rx="1" transform="rotate(-45 32 10)"/>
        <rect x="6" y="26" width="4" height="8" rx="1" transform="rotate(-45 8 30)"/>
        <rect x="30" y="26" width="4" height="8" rx="1" transform="rotate(45 32 30)"/>
      </g>
    </g>
    <text x="80" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Task Processing</text>
    <text x="80" y="112" text-anchor="middle" font-size="11" fill="#6b7280">Simulated work</text>
  </g>

  <!-- ============================================ -->
  <!-- APPLICATION CONSOLE -->
  <!-- ============================================ -->
  <g transform="translate(1015, 400)">
    <rect width="210" height="130" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="20" y="14" width="170" height="80" rx="6" fill="#1f2937"/>
    <circle cx="32" cy="26" r="3" fill="#ef4444"/>
    <circle cx="44" cy="26" r="3" fill="#f59e0b"/>
    <circle cx="56" cy="26" r="3" fill="#10b981"/>
    <text x="105" y="48" text-anchor="middle" font-size="9" font-family="Menlo, Consolas, monospace" fill="#10b981">Task started</text>
    <text x="105" y="62" text-anchor="middle" font-size="9" font-family="Menlo, Consolas, monospace" fill="#10b981">Processing...</text>
    <text x="105" y="76" text-anchor="middle" font-size="9" font-family="Menlo, Consolas, monospace" fill="#10b981">Task completed</text>
    <text x="105" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Application Console</text>
  </g>

  <!-- ============================================ -->
  <!-- ANIMATED BLACK ARROWS -->
  <!-- ============================================ -->

  <!-- 1. Request: Postman -> Flask -->
  <line x1="252" y1="345" x2="468" y2="305" class="flow" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="312" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">POST /tasks</text>

  <!-- 2a. HTTP Response: Flask -> Postman (animated) -->
  <path d="M 468 360 Q 280 470 175 400" fill="none" class="flow" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="305" y="448" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">HTTP 200</text>

  <!-- 2b. start task: Flask -> Background Task -->
  <line x1="732" y1="285" x2="908" y2="275" class="flow" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="266" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">start task</text>

  <!-- 2c. execute: Background Task -> Processing -->
  <line x1="1102" y1="285" x2="1128" y2="285" class="flow" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1115" y="273" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">execute</text>

  <!-- 2d. progress: Processing -> Console -->
  <path d="M 1210 350 Q 1210 405 1125 410" fill="none" class="flow" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1230" y="385" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">progress</text>
</svg>