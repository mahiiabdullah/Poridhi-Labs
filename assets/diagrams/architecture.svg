<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1400" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <text x="700" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Lab 18 — Flask API with Background Tasks</text>
  <text x="700" y="64" text-anchor="middle" font-size="13" fill="#6b7280">How a Flask API responds immediately while work continues in the background</text>

  <!-- ============================================ -->
  <!-- CLIENT: Postman -->
  <!-- ============================================ -->
  <g transform="translate(80, 280)">
    <rect width="170" height="140" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <g transform="translate(60, 20)">
      <circle cx="25" cy="22" r="22" fill="#ff6c37"/>
      <circle cx="14" cy="17" r="5" fill="#ffffff"/>
      <circle cx="33" cy="18" r="4" fill="#ffffff"/>
      <circle cx="25" cy="30" r="5" fill="#ffffff"/>
      <circle cx="25" cy="22" r="22" fill="none" stroke="#ffffff" stroke-width="0"/>
    </g>
    <text x="85" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Postman</text>
    <text x="85" y="116" text-anchor="middle" font-size="11" fill="#6b7280">HTTP Client</text>
  </g>

  <!-- ============================================ -->
  <!-- API SERVER: Flask API -->
  <!-- ============================================ -->
  <g transform="translate(420, 200)">
    <rect width="240" height="180" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

    <!-- Clean Flask flask icon -->
    <g transform="translate(95, 18)">
      <path d="M 30 5 Q 32 5 32 8 L 30 18 L 18 18 L 16 8 Q 16 5 18 5 Z" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round"/>
      <line x1="22" y1="11" x2="26" y2="11" stroke="#111827" stroke-width="2"/>
      <path d="M 18 20 Q 8 28 8 36 Q 8 46 24 46 Q 40 46 40 36 Q 40 28 30 20 Z" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round"/>
      <line x1="14" y1="32" x2="34" y2="32" stroke="#111827" stroke-width="2"/>
    </g>

    <text x="120" y="108" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Flask API</text>
    <text x="120" y="128" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#6b7280">POST /tasks</text>
    <rect x="78" y="140" width="84" height="22" rx="11" fill="#eef2ff"/>
    <text x="120" y="155" text-anchor="middle" font-size="10" font-weight="700" fill="#4f46e5">PYTHON</text>
  </g>

  <!-- ============================================ -->
  <!-- BACKGROUND EXECUTION BOUNDARY -->
  <!-- ============================================ -->
  <g>
    <rect x="810" y="140" width="490" height="430" rx="18" fill="#f5f3ff" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="8 4"/>
    <rect x="810" y="140" width="180" height="28" rx="14" fill="#6366f1"/>
    <text x="900" y="159" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Background Execution</text>
  </g>

  <!-- ============================================ -->
  <!-- BACKGROUND TASK -->
  <!-- ============================================ -->
  <g transform="translate(840, 200)">
    <rect width="210" height="120" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <g transform="translate(85, 18)">
      <circle cx="20" cy="0" r="6" fill="#6366f1"/>
      <circle cx="0" cy="20" r="6" fill="#6366f1"/>
      <circle cx="40" cy="20" r="6" fill="#6366f1"/>
      <circle cx="20" cy="40" r="6" fill="#6366f1"/>
      <line x1="17" y1="4" x2="4" y2="17" stroke="#6366f1" stroke-width="2"/>
      <line x1="23" y1="4" x2="36" y2="17" stroke="#6366f1" stroke-width="2"/>
      <line x1="6" y1="23" x2="17" y2="37" stroke="#6366f1" stroke-width="2"/>
      <line x1="34" y1="23" x2="23" y2="37" stroke="#6366f1" stroke-width="2"/>
    </g>
    <text x="105" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Background Task</text>
    <text x="105" y="100" text-anchor="middle" font-size="11" fill="#6b7280">Runs independently</text>
  </g>

  <!-- ============================================ -->
  <!-- TASK PROCESSING -->
  <!-- ============================================ -->
  <g transform="translate(1090, 200)">
    <rect width="180" height="120" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <g transform="translate(70, 16)">
      <circle cx="20" cy="20" r="14" fill="#6366f1"/>
      <circle cx="20" cy="20" r="6" fill="#ffffff"/>
      <g fill="#6366f1">
        <rect x="18" y="0" width="4" height="8" rx="1"/>
        <rect x="18" y="32" width="4" height="8" rx="1"/>
        <rect x="0" y="18" width="8" height="4" rx="1"/>
        <rect x="32" y="18" width="8" height="4" rx="1"/>
        <rect x="6" y="6" width="4" height="8" rx="1" transform="rotate(45 8 10)"/>
        <rect x="30" y="6" width="4" height="8" rx="1" transform="rotate(-45 32 10)"/>
        <rect x="6" y="26" width="4" height="8" rx="1" transform="rotate(-45 8 30)"/>
        <rect x="30" y="26" width="4" height="8" rx="1" transform="rotate(45 32 30)"/>
      </g>
    </g>
    <text x="90" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Task Processing</text>
    <text x="90" y="100" text-anchor="middle" font-size="11" fill="#6b7280">Simulated work</text>
  </g>

  <!-- ============================================ -->
  <!-- APPLICATION CONSOLE / TERMINAL -->
  <!-- ============================================ -->
  <g transform="translate(965, 400)">
    <rect width="210" height="130" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="20" y="14" width="170" height="80" rx="6" fill="#1f2937"/>
    <circle cx="32" cy="26" r="3" fill="#ef4444"/>
    <circle cx="44" cy="26" r="3" fill="#f59e0b"/>
    <circle cx="56" cy="26" r="3" fill="#10b981"/>
    <text x="105" y="48" text-anchor="middle" font-size="9" font-family="Menlo, Consolas, monospace" fill="#10b981">Task started</text>
    <text x="105" y="62" text-anchor="middle" font-size="9" font-family="Menlo, Consolas, monospace" fill="#10b981">Processing...</text>
    <text x="105" y="76" text-anchor="middle" font-size="9" font-family="Menlo, Consolas, monospace" fill="#10b981">Task completed</text>
    <text x="105" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Application Console</text>
  </g>

  <!-- ============================================ -->
  <!-- ARROWS -->
  <!-- ============================================ -->

  <!-- 1. Request: Postman -> Flask -->
  <line x1="252" y1="340" x2="418" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="305" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">POST /tasks</text>

  <!-- 2a. HTTP Response: Flask -> Postman (return arrow, dashed green) -->
  <path d="M 418 350 Q 250 450 165 388" fill="none" stroke="#10b981" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-response)"/>
  <rect x="195" y="408" width="180" height="22" rx="11" fill="#d1fae5"/>
  <text x="285" y="423" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">HTTP 200 — Task started</text>

  <!-- 2b. start task: Flask -> Background Task -->
  <line x1="662" y1="260" x2="838" y2="250" stroke="#6366f1" stroke-width="2.2" marker-end="url(#arrow-bg)"/>
  <rect x="688" y="226" width="120" height="22" rx="11" fill="#eef2ff"/>
  <text x="748" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#4338ca">start task</text>

  <!-- 2c. execute: Background Task -> Processing -->
  <line x1="1052" y1="260" x2="1088" y2="260" stroke="#6366f1" stroke-width="2.2" marker-end="url(#arrow-bg)"/>
  <text x="1070" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#4338ca">execute</text>

  <!-- 2d. progress: Processing -> Console -->
  <path d="M 1180 322 Q 1180 380 1075 410" fill="none" stroke="#6366f1" stroke-width="2.2" marker-end="url(#arrow-bg)"/>
  <rect x="1090" y="345" width="95" height="22" rx="11" fill="#eef2ff"/>
  <text x="1137" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#4338ca">progress</text>

  <!-- ============================================ -->
  <!-- ANNOTATION -->
  <!-- ============================================ -->
  <g transform="translate(540, 595)">
    <rect width="380" height="50" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="190" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Key idea</text>
    <text x="190" y="40" text-anchor="middle" font-size="11" fill="#78350f">Response returns before task completes</text>
  </g>

  <!-- ============================================ -->
  <!-- LEGEND -->
  <!-- ============================================ -->
  <g transform="translate(110, 595)">
    <rect width="380" height="80" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#111827">Legend</text>

    <line x1="14" y1="44" x2="46" y2="44" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="54" y="48" font-size="10" fill="#374151">Request</text>

    <line x1="124" y1="44" x2="156" y2="44" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-response)"/>
    <text x="164" y="48" font-size="10" fill="#047857">HTTP response</text>

    <line x1="262" y1="44" x2="294" y2="44" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-bg)"/>
    <text x="302" y="48" font-size="10" fill="#4338ca">Background flow</text>

    <rect x="14" y="60" width="14" height="10" fill="#f5f3ff" stroke="#a5b4fc" stroke-dasharray="3 2"/>
    <text x="34" y="69" font-size="10" fill="#374151">Async execution boundary</text>
  </g>
</svg>
