<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" font-family="Helvetica, Arial, sans-serif">

  <!-- background -->
  <rect width="1080" height="460" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="48" font-size="22" font-weight="700" fill="#111827">Lab 20 — Celery Task Retry with Exponential Backoff</text>
  <text x="40" y="72" font-size="13" fill="#6b7280">A failing task is re-queued automatically. Each retry waits longer than the previous one.</text>

  <!-- ============ BOX 1: CLIENT ============ -->
  <g>
    <rect x="60" y="140" width="180" height="150" rx="10"
          fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="150" y="170" text-anchor="middle"
          font-size="16" font-weight="700" fill="#111827">CLIENT</text>
    <text x="150" y="190" text-anchor="middle"
          font-size="11" fill="#6b7280">curl · browser</text>
    <line x1="80" y1="204" x2="220" y2="204" stroke="#e5e7eb" stroke-width="1"/>

    <rect x="90" y="220" width="120" height="30" rx="4" fill="#0f172a"/>
    <text x="150" y="240" text-anchor="middle"
          font-size="11" font-family="Menlo, Consolas, monospace" fill="#cbd5e1">POST /tasks</text>

    <text x="150" y="272" text-anchor="middle" font-size="11" fill="#374151">gets 202 back</text>
    <text x="150" y="286" text-anchor="middle" font-size="11" fill="#374151">in milliseconds</text>
  </g>

  <!-- arrow: client -> flask -->
  <line x1="242" y1="200" x2="338" y2="200"
        stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="290" y="190" text-anchor="middle" font-size="11" fill="#374151">request</text>
  <line x1="338" y1="232" x2="242" y2="232"
        stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"
        marker-end="url(#ar)"/>
  <text x="290" y="248" text-anchor="middle" font-size="11" fill="#6b7280">202</text>

  <!-- ============ BOX 2: FLASK API ============ -->
  <g>
    <rect x="340" y="140" width="220" height="150" rx="10"
          fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="450" y="170" text-anchor="middle"
          font-size="16" font-weight="700" fill="#111827">FLASK API</text>
    <text x="450" y="190" text-anchor="middle"
          font-size="11" fill="#6b7280">web container · port 5000</text>
    <line x1="360" y1="204" x2="540" y2="204" stroke="#e5e7eb" stroke-width="1"/>

    <rect x="360" y="220" width="180" height="55" rx="4" fill="#0d1117"/>
    <text x="370" y="238" font-size="10" font-family="Menlo, Consolas, monospace" fill="#7ee787">flaky_task</text>
    <text x="378" y="252" font-size="10" font-family="Menlo, Consolas, monospace" fill="#f1fa8c">  .apply_async(args=...)</text>
    <text x="370" y="266" font-size="9" font-family="Menlo, Consolas, monospace" fill="#6e7681"># publishes the failing task</text>
  </g>

  <!-- arrow: flask -> rabbitmq -->
  <line x1="562" y1="200" x2="658" y2="200"
        stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="610" y="190" text-anchor="middle" font-size="11" fill="#374151">AMQP</text>

  <!-- ============ BOX 3: RABBITMQ ============ -->
  <g>
    <rect x="660" y="140" width="200" height="150" rx="10"
          fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="760" y="170" text-anchor="middle"
          font-size="16" font-weight="700" fill="#111827">RABBITMQ</text>
    <text x="760" y="190" text-anchor="middle"
          font-size="11" fill="#6b7280">broker</text>
    <line x1="680" y1="204" x2="840" y2="204" stroke="#e5e7eb" stroke-width="1"/>

    <rect x="690" y="222" width="140" height="30" rx="4"
          fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="710" y="242" font-size="12" font-family="Menlo, Consolas, monospace" fill="#92400e">celery</text>
    <circle cx="814" cy="237" r="10" fill="#16a34a"/>
    <text x="814" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">D</text>
    <text x="760" y="272" text-anchor="middle" font-size="11" fill="#374151">durable queue</text>
  </g>

  <!-- arrow: rabbitmq -> worker (downward) -->
  <line x1="760" y1="292" x2="760" y2="350"
        stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>
  <text x="772" y="324" font-size="11" fill="#15803d">deliver</text>

  <!-- ============ BOX 4: CELERY WORKER ============ -->
  <g>
    <rect x="120" y="352" width="540" height="80" rx="10"
          fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="390" y="376" text-anchor="middle"
          font-size="15" font-weight="700" fill="#111827">CELERY WORKER</text>
    <text x="390" y="394" text-anchor="middle"
          font-size="11" fill="#15803d">runs flaky_task — catches TransientError and retries automatically</text>
    <text x="390" y="412" text-anchor="middle"
          font-size="11" font-family="Menlo, Consolas, monospace" fill="#6b7280">autoretry_for=(TransientError,)  ·  retry_backoff=True  ·  max_retries=5</text>
  </g>

  <!-- retry loop arrow (right side, red) -->
  <path d="M 660 392 L 870 392 L 870 392 L 880 392"
        fill="none"/>
  <path d="M 660 380 L 880 380 L 880 408 L 660 408"
        fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"
        marker-end="url(#arr)"/>
  <text x="770" y="374" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">retry with backoff</text>
  <text x="770" y="425" text-anchor="middle" font-size="10" font-family="Menlo, Consolas, monospace" fill="#b91c1c">1s → 2s → 4s → 8s → 16s</text>

  <!-- failure arrow off to the right -->
  <g>
    <rect x="900" y="352" width="120" height="80" rx="10"
          fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <text x="960" y="376" text-anchor="middle"
          font-size="14" font-weight="700" fill="#111827">OUTCOME</text>
    <line x1="910" y1="386" x2="1010" y2="386" stroke="#e5e7eb" stroke-width="1"/>
    <text x="960" y="402" text-anchor="middle"
          font-size="11" font-weight="700" fill="#15803d">success</text>
    <text x="960" y="418" text-anchor="middle"
          font-size="11" font-weight="700" fill="#b91c1c">or failed</text>
  </g>

  <!-- bottom note -->
  <text x="40" y="455" font-size="11" fill="#374151" font-style="italic">
    After max_retries the task fails permanently and the exception is raised for real.
  </text>

  <!-- arrow marker defs -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

</svg>
