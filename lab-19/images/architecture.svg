<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" font-family="Helvetica, Arial, sans-serif">

  <!-- background -->
  <rect width="1080" height="460" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="48" font-size="22" font-weight="700" fill="#111827">Lab 19 — RabbitMQ Durability and Late Acks</text>
  <text x="40" y="72" font-size="13" fill="#6b7280">Flask publishes a task to RabbitMQ; a Celery worker picks it up and acks only after it finishes.</text>

  <!-- ============ BOX 1: CLIENT ============ -->
  <g>
    <rect x="60" y="160" width="200" height="160" rx="10"
          fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="160" y="190" text-anchor="middle"
          font-size="16" font-weight="700" fill="#111827">CLIENT</text>
    <text x="160" y="210" text-anchor="middle"
          font-size="11" fill="#6b7280">curl · browser</text>
    <line x1="80" y1="224" x2="240" y2="224" stroke="#e5e7eb" stroke-width="1"/>

    <rect x="100" y="240" width="120" height="34" rx="4" fill="#0f172a"/>
    <text x="160" y="261" text-anchor="middle"
          font-size="11" font-family="Menlo, Consolas, monospace" fill="#cbd5e1">POST /tasks</text>

    <text x="160" y="298" text-anchor="middle" font-size="11" fill="#374151">sends task,</text>
    <text x="160" y="312" text-anchor="middle" font-size="11" fill="#374151">gets 202 back</text>
  </g>

  <!-- arrow: client -> flask -->
  <line x1="262" y1="230" x2="358" y2="230"
        stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="310" y="220" text-anchor="middle" font-size="11" fill="#374151">HTTP request</text>
  <line x1="358" y1="260" x2="262" y2="260"
        stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"
        marker-end="url(#ar)"/>
  <text x="310" y="276" text-anchor="middle" font-size="11" fill="#6b7280">HTTP 202</text>

  <!-- ============ BOX 2: FLASK API ============ -->
  <g>
    <rect x="360" y="160" width="220" height="160" rx="10"
          fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="470" y="190" text-anchor="middle"
          font-size="16" font-weight="700" fill="#111827">FLASK API</text>
    <text x="470" y="210" text-anchor="middle"
          font-size="11" fill="#6b7280">web container · port 5000</text>
    <line x1="380" y1="224" x2="560" y2="224" stroke="#e5e7eb" stroke-width="1"/>

    <rect x="380" y="240" width="180" height="60" rx="4" fill="#0d1117"/>
    <text x="390" y="258" font-size="10" font-family="Menlo, Consolas, monospace" fill="#7ee787">run_background_task</text>
    <text x="398" y="272" font-size="10" font-family="Menlo, Consolas, monospace" fill="#f1fa8c">  .apply_async(args=...)</text>
    <text x="390" y="286" font-size="9" font-family="Menlo, Consolas, monospace" fill="#6e7681"># posts to broker, returns 202</text>
  </g>

  <!-- arrow: flask -> rabbitmq -->
  <line x1="582" y1="230" x2="678" y2="230"
        stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="630" y="220" text-anchor="middle" font-size="11" fill="#374151">AMQP publish</text>

  <!-- ============ BOX 3: RABBITMQ ============ -->
  <g>
    <rect x="680" y="160" width="220" height="160" rx="10"
          fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="790" y="190" text-anchor="middle"
          font-size="16" font-weight="700" fill="#111827">RABBITMQ</text>
    <text x="790" y="210" text-anchor="middle"
          font-size="11" fill="#6b7280">broker · AMQP</text>
    <line x1="700" y1="224" x2="880" y2="224" stroke="#e5e7eb" stroke-width="1"/>

    <!-- queue with D badge -->
    <rect x="710" y="244" width="160" height="32" rx="4"
          fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="730" y="265" font-size="12" font-family="Menlo, Consolas, monospace" fill="#92400e">celery</text>
    <circle cx="850" cy="260" r="10" fill="#16a34a"/>
    <text x="850" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">D</text>
    <text x="790" y="295" text-anchor="middle" font-size="11" fill="#374151">durable queue — survives restart</text>
    <text x="790" y="310" text-anchor="middle" font-size="10" fill="#6b7280">port 5672</text>
  </g>

  <!-- arrow: rabbitmq -> worker (downward) -->
  <line x1="790" y1="322" x2="790" y2="382"
        stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>
  <text x="800" y="358" font-size="11" fill="#15803d">deliver (prefetch=1)</text>

  <!-- ============ BOX 4: CELERY WORKER ============ -->
  <g>
    <rect x="380" y="384" width="600" height="56" rx="10"
          fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="680" y="408" text-anchor="middle"
          font-size="14" font-weight="700" fill="#111827">CELERY WORKER</text>
    <text x="680" y="426" text-anchor="middle"
          font-size="11" fill="#15803d">runs task · sends ack only after task completes (acks_late=True)</text>
  </g>

  <!-- ack return arrow (worker -> rabbitmq, going up on right side) -->
  <line x1="980" y1="412" x2="980" y2="260"
        stroke="#0e7490" stroke-width="2" stroke-dasharray="6 4"
        marker-end="url(#am)"/>
  <text x="994" y="338" font-size="11" fill="#0e7490">late ack</text>

  <!-- bottom note -->
  <text x="40" y="450" font-size="11" fill="#374151" font-style="italic">
    If the worker crashes mid-task, RabbitMQ requeues the message because the ack never arrived.
  </text>

  <!-- arrow marker defs -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7490"/>
    </marker>
  </defs>

</svg>
