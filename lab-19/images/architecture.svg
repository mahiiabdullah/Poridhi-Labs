<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1600 850" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, system-ui, sans-serif">

  <!-- ===================== ARROW MARKERS ===================== -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1f2937"/></marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b45309"/></marker>
    <marker id="arr-violet" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/></marker>
    <marker id="arr-dash" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/></marker>

    <!-- Postman logo (vector mark) -->
    <symbol id="logo-postman" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="28" fill="#ff6c37"/>
      <circle cx="32" cy="32" r="14" fill="#ffffff"/>
      <circle cx="32" cy="32" r="6"  fill="#ff6c37"/>
    </symbol>

    <!-- Flask logo (minimal vector mark) -->
    <symbol id="logo-flask" viewBox="0 0 64 64">
      <path d="M22 8 H42 V20 L50 50 Q52 58 44 58 H20 Q12 58 14 50 L22 20 Z"
            fill="#ffffff" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
      <path d="M22 8 H42 M28 28 H36" stroke="#111827" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="32" cy="44" rx="9" ry="3" fill="#111827" opacity="0.15"/>
    </symbol>

    <!-- RabbitMQ logo (vector mark) -->
    <symbol id="logo-rabbit" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="28" fill="#ff6600"/>
      <text x="32" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800" font-family="Segoe UI, sans-serif">R</text>
    </symbol>

    <!-- Celery logo (simple leaf mark) -->
    <symbol id="logo-celery" viewBox="0 0 64 64">
      <path d="M14 50 Q14 22 32 14 Q50 22 50 50 Q50 36 32 36 Q14 36 14 50 Z"
            fill="#37814a"/>
      <path d="M32 14 V50" stroke="#1f4a2a" stroke-width="1.5" fill="none"/>
    </symbol>

    <!-- Generic process/terminal icon for the background task -->
    <symbol id="logo-task" viewBox="0 0 64 64">
      <rect x="8" y="12" width="48" height="40" rx="5" fill="#ffffff" stroke="#374151" stroke-width="2"/>
      <rect x="8" y="12" width="48" height="9" rx="5" fill="#374151"/>
      <circle cx="14" cy="16.5" r="1.6" fill="#ffffff"/>
      <circle cx="20" cy="16.5" r="1.6" fill="#ffffff"/>
      <text x="32" y="40" text-anchor="middle" fill="#374151" font-size="11" font-family="Consolas, monospace" font-weight="700">&gt;_</text>
    </symbol>

    <!-- Docker whale (minimal) -->
    <symbol id="logo-docker" viewBox="0 0 64 64">
      <rect x="6"  y="32" width="10" height="10" fill="#0db7ed"/>
      <rect x="18" y="32" width="10" height="10" fill="#0db7ed"/>
      <rect x="30" y="32" width="10" height="10" fill="#0db7ed"/>
      <rect x="42" y="32" width="10" height="10" fill="#0db7ed"/>
      <rect x="18" y="20" width="10" height="10" fill="#0db7ed"/>
      <rect x="30" y="20" width="10" height="10" fill="#0db7ed"/>
      <rect x="30" y="8"  width="10" height="10" fill="#0db7ed"/>
    </symbol>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect width="1600" height="850" fill="#ffffff"/>

  <!-- ===================== TITLE ===================== -->
  <text x="800" y="40" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="700">Lab 19 — RabbitMQ Durability, Management UI, and Acknowledgment Policies</text>
  <text x="800" y="62" text-anchor="middle" fill="#64748b" font-size="13">Flask publishes a Celery task → RabbitMQ stores it in a durable queue → worker consumes → late ACK</text>

  <!-- ===================== DOCKER COMPOSE outer boundary ===================== -->
  <rect x="300" y="220" width="1040" height="320" rx="14" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8,4"/>
  <rect x="320" y="212" width="170" height="18" fill="#ffffff"/>
  <text x="405" y="225" text-anchor="middle" fill="#475569" font-size="11" font-weight="600">Docker Compose</text>
  <use href="#logo-docker" x="322" y="213" width="14" height="14"/>

  <!-- ===================== POSTMAN / CLIENT ===================== -->
  <rect x="80" y="320" width="180" height="120" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <use href="#logo-postman" x="115" y="335" width="44" height="44"/>
  <text x="170" y="405" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">Postman</text>
  <text x="170" y="425" text-anchor="middle" fill="#475569" font-size="11">HTTP Client</text>

  <!-- arrow label between Postman and Flask -->
  <text x="260" y="375" text-anchor="middle" fill="#1f2937" font-size="11" font-weight="600">POST /tasks</text>

  <!-- ===================== FLASK API ===================== -->
  <rect x="320" y="320" width="200" height="120" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <use href="#logo-flask" x="345" y="335" width="36" height="48"/>
  <text x="420" y="352" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">Flask API</text>
  <text x="420" y="372" text-anchor="middle" fill="#475569" font-size="11">:5000</text>
  <text x="420" y="395" text-anchor="middle" fill="#475569" font-size="10">Publishes Celery task</text>
  <text x="420" y="415" text-anchor="middle" fill="#1f2937" font-size="10" font-weight="600">apply_async()</text>

  <!-- arrow label between Flask and RabbitMQ -->
  <text x="540" y="375" text-anchor="middle" fill="#1f2937" font-size="11" font-weight="600">Celery Task</text>

  <!-- ===================== RABBITMQ (center, large) ===================== -->
  <rect x="600" y="290" width="380" height="280" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="790" y="318" text-anchor="middle" fill="#7c2d12" font-size="12" font-weight="700" letter-spacing="1">RABBITMQ MESSAGE BROKER</text>

  <!-- RabbitMQ logo + subtitle row -->
  <use href="#logo-rabbit" x="618" y="332" width="36" height="36"/>
  <text x="790" y="348" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="700">RabbitMQ</text>
  <text x="790" y="364" text-anchor="middle" fill="#92400e" font-size="11">AMQP :5672</text>

  <!-- celery queue panel inside RabbitMQ -->
  <rect x="630" y="390" width="320" height="80" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="790" y="415" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="700">celery</text>
  <!-- durable badge -->
  <rect x="660" y="428" width="22" height="20" rx="4" fill="#15803d"/>
  <text x="671" y="442" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">D</text>
  <text x="700" y="442" fill="#166534" font-size="12" font-weight="700">Durable</text>
  <text x="790" y="460" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">Survives broker restart</text>

  <!-- Mgmt port annotation -->
  <text x="790" y="552" text-anchor="middle" fill="#64748b" font-size="10">Management port :15672 (shown above)</text>

  <!-- ===================== CELERY WORKER ===================== -->
  <rect x="1080" y="320" width="220" height="120" rx="12" fill="#ffffff" stroke="#37814a" stroke-width="2"/>
  <use href="#logo-celery" x="1100" y="335" width="40" height="40"/>
  <text x="1190" y="352" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">Celery Worker</text>
  <text x="1190" y="372" text-anchor="middle" fill="#475569" font-size="11">Consumer</text>
  <!-- small inline labels -->
  <rect x="1100" y="388" width="68" height="20" rx="4" fill="#f0fdf4" stroke="#37814a" stroke-width="1"/>
  <text x="1134" y="402" text-anchor="middle" fill="#166534" font-size="10" font-weight="700">Late ACK</text>
  <rect x="1175" y="388" width="105" height="20" rx="4" fill="#f0fdf4" stroke="#37814a" stroke-width="1"/>
  <text x="1227" y="402" text-anchor="middle" fill="#166534" font-size="10" font-weight="700">Prefetch = 1</text>
  <text x="1190" y="428" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">ACK after task execution</text>

  <!-- ===================== BACKGROUND TASK (outside Docker boundary) ===================== -->
  <rect x="1380" y="320" width="180" height="100" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <use href="#logo-task" x="1395" y="332" width="40" height="40"/>
  <text x="1470" y="352" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">Background Task</text>
  <text x="1470" y="372" text-anchor="middle" fill="#475569" font-size="11">Task Processing</text>
  <text x="1470" y="395" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">5–30 seconds</text>

  <!-- ===================== MGMT UI (top-right, monitoring path) ===================== -->
  <rect x="1180" y="100" width="320" height="110" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <use href="#logo-rabbit" x="1198" y="115" width="34" height="34"/>
  <text x="1370" y="128" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">RabbitMQ Management UI</text>
  <text x="1370" y="150" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="700">:15672</text>
  <text x="1340" y="175" text-anchor="middle" fill="#475569" font-size="10">Queues · Messages · Consumers</text>
  <text x="1340" y="192" text-anchor="middle" fill="#475569" font-size="10">guest / guest</text>

  <!-- ===================== ARROWS — main task flow (solid black) ===================== -->
  <!-- Postman → Flask -->
  <line x1="260" y1="380" x2="320" y2="380" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Flask → RabbitMQ -->
  <line x1="520" y1="380" x2="600" y2="380" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <!-- RabbitMQ queue → Celery Worker -->
  <line x1="950" y1="430" x2="1080" y2="380" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1015" y="395" text-anchor="middle" fill="#1f2937" font-size="11" font-weight="600">Consume</text>
  <!-- Celery Worker → Background Task -->
  <line x1="1300" y1="380" x2="1380" y2="380" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1340" y="370" text-anchor="middle" fill="#1f2937" font-size="11" font-weight="600">Execute</text>

  <!-- ===================== ARROWS — secondary dashed ===================== -->
  <!-- ACK from worker back to queue -->
  <path d="M1110 340 Q1000 300 945 400" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr-dash)"/>
  <text x="1020" y="335" text-anchor="middle" fill="#475569" font-size="10" font-style="italic">ACK after completion</text>

  <!-- Worker crash → Requeue -->
  <path d="M1100 400 Q1040 480 1010 500 Q950 515 870 500 Q800 485 790 490" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-dash)"/>
  <text x="985" y="532" text-anchor="middle" fill="#475569" font-size="10" font-style="italic">Worker crash → No ACK → Requeue → Task can be consumed again</text>

  <!-- Mgmt UI → RabbitMQ (monitor) -->
  <path d="M1240 210 Q1180 270 950 290" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr-violet)"/>
  <text x="1100" y="250" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="600">Monitor</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="60" y="740" width="1480" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="762" fill="#475569" font-size="11" font-weight="700">LEGEND</text>

  <!-- solid arrow -->
  <line x1="80"  y1="785" x2="120" y2="785" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="130" y="789" fill="#0f172a" font-size="11">Task / Message Flow</text>

  <!-- dashed arrow -->
  <line x1="290" y1="785" x2="330" y2="785" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr-dash)"/>
  <text x="340" y="789" fill="#0f172a" font-size="11">Monitoring / ACK / Failure Flow</text>

  <!-- durable badge -->
  <rect x="610" y="777" width="18" height="16" rx="3" fill="#15803d"/>
  <text x="619" y="789" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">D</text>
  <text x="635" y="789" fill="#0f172a" font-size="11">Durable Queue · survives broker restart</text>

  <!-- late ack chip -->
  <rect x="930" y="777" width="90" height="16" rx="4" fill="#f0fdf4" stroke="#37814a" stroke-width="1"/>
  <text x="975" y="789" text-anchor="middle" fill="#166534" font-size="10" font-weight="700">Late ACK</text>
  <text x="1030" y="789" fill="#0f172a" font-size="11">acknowledgment after task execution</text>

  <!-- bottom note -->
  <text x="800" y="813" text-anchor="middle" fill="#94a3b8" font-size="10">Docker Compose runs Flask + RabbitMQ + Celery worker on a shared network. Management UI is a separate observation path, not part of task processing.</text>

</svg>
