<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 480" width="900" height="480" font-family="Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="480" fill="#ffffff"/>

  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- ============================================== -->
  <!-- HTTP Request/Response Path box (left) -->
  <!-- ============================================== -->
  <rect x="40" y="40" width="320" height="400" rx="20" ry="20" fill="#f2f2f2" stroke="#a6a6a6" stroke-width="1.5"/>
  <text x="200" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">HTTP Request/Response Path</text>

  <!-- HTTP Client : Postman box -->
  <rect x="70" y="95" width="260" height="120" rx="12" ry="12" fill="#ffffff" stroke="#a6a6a6" stroke-width="1.2"/>
  <text x="200" y="118" text-anchor="middle" font-size="13" fill="#1a1a1a">
    <tspan font-weight="bold">HTTP Client : </tspan>
    <tspan font-weight="bold" fill="#e36209">Postman</tspan>
  </text>
  <!-- Postman icon (inline SVG, no base64) -->
  <g transform="translate(160, 150)">
    <!-- Postman: orange rounded square with stylized "P" arrow -->
    <rect x="0" y="0" width="80" height="40" rx="8" ry="8" fill="#e36209"/>
    <circle cx="40" cy="20" r="9" fill="#ffffff"/>
    <path d="M 34 20 L 46 20 M 42 16 L 46 20 L 42 24" stroke="#e36209" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="20" r="2.5" fill="#e36209"/>
  </g>

  <!-- Flask API box -->
  <rect x="70" y="265" width="260" height="160" rx="12" ry="12" fill="#ffffff" stroke="#a6a6a6" stroke-width="1.2"/>
  <text x="200" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Flask API</text>
  <!-- Flask icon (inline SVG, no base64) -->
  <g transform="translate(85, 305)">
    <!-- Flask body -->
    <path d="M 14 2 L 26 2 L 26 14 L 36 32 L 4 32 L 14 14 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Liquid -->
    <path d="M 8.5 22 L 31.5 22 L 36 32 L 4 32 Z" fill="#4a8c2a"/>
    <!-- Bubbles -->
    <circle cx="14" cy="27" r="1.4" fill="#ffffff"/>
    <circle cx="20" cy="28.5" r="1" fill="#ffffff"/>
    <circle cx="26" cy="26" r="1.2" fill="#ffffff"/>
    <!-- Top cap -->
    <rect x="13" y="0" width="14" height="4" rx="1" ry="1" fill="#1a1a1a"/>
  </g>
  <text x="135" y="320" font-size="12" fill="#1a1a1a">• Receives request</text>
  <text x="135" y="340" font-size="12" fill="#1a1a1a">• Spawns a thread</text>

  <!-- ============================================== -->
  <!-- Background Execution Path box (right) -->
  <!-- ============================================== -->
  <rect x="430" y="40" width="430" height="400" rx="20" ry="20" fill="#f2f2f2" stroke="#a6a6a6" stroke-width="1.5"/>
  <text x="645" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Background Execution Path</text>

  <!-- Background Task box -->
  <rect x="460" y="95" width="370" height="140" rx="12" ry="12" fill="#ffffff" stroke="#a6a6a6" stroke-width="1.2"/>
  <text x="645" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Background Task</text>
  <text x="475" y="148" font-size="12" fill="#1a1a1a">• Spawn new thread</text>
  <text x="475" y="168" font-size="12" fill="#1a1a1a">• Execute background job</text>
  <text x="475" y="188" font-size="12" fill="#1a1a1a">• Print progress messages</text>
  <text x="475" y="208" font-size="12" fill="#1a1a1a">• Mark task as completed</text>

  <!-- Terminal View box -->
  <rect x="460" y="265" width="370" height="160" rx="12" ry="12" fill="#ffffff" stroke="#a6a6a6" stroke-width="1.2"/>
  <text x="645" y="288" text-anchor="middle" font-size="13" fill="#1a1a1a">Terminal View</text>

  <!-- Inline terminal mockup (no base64) -->
  <g transform="translate(475, 305)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="340" height="105" rx="6" ry="6" fill="#1e1e1e"/>
    <!-- Title bar dots -->
    <circle cx="12" cy="12" r="3.5" fill="#ff5f56"/>
    <circle cx="24" cy="12" r="3.5" fill="#ffbd2e"/>
    <circle cx="36" cy="12" r="3.5" fill="#27c93f"/>
    <!-- Green monospace log lines -->
    <text x="10" y="35" font-family="'Courier New', Courier, monospace" font-size="11" fill="#4ec96d">[Task a1b2] Task started</text>
    <text x="10" y="52" font-family="'Courier New', Courier, monospace" font-size="11" fill="#4ec96d">[Task a1b2] Task processing... (1/5)</text>
    <text x="10" y="69" font-family="'Courier New', Courier, monospace" font-size="11" fill="#4ec96d">[Task a1b2] Task processing... (2/5)</text>
    <text x="10" y="86" font-family="'Courier New', Courier, monospace" font-size="11" fill="#4ec96d">[Task a1b2] Task processing... (3/5)</text>
    <!-- Blinking cursor -->
    <rect x="10" y="92" width="8" height="2" fill="#4ec96d">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ============================================== -->
  <!-- ANIMATED ARROWS (Marching Ants)               -->
  <!-- ============================================== -->

  <!-- Arrow 1: POST /Task (down, Postman -> Flask). Centered at x=210, gap of 2px from each box edge -->
  <line class="arrow" x1="210" y1="217" x2="210" y2="263" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <text x="190" y="244" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">POST /Task</text>

  <!-- Arrow 2: 202 Accepted (up, Flask -> Postman). Offset to x=230 so it does not overlap Arrow 1 -->
  <line class="arrow" x1="230" y1="263" x2="230" y2="217" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <text x="250" y="244" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">202 Accepted</text>

  <!-- Arrow 3: Start Task (Flask right-edge -> Background Task left-edge). Elbow path: right, up, right, into the box -->
  <path class="arrow" d="M 330,345 H 400 V 165 H 456" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" values="14;0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <!-- Halo behind the Start Task label so the elbow path does not intersect the text -->
  <rect x="364" y="247" width="72" height="14" rx="3" ry="3" fill="#ffffff" stroke="none"/>
  <text x="400" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Start Task</text>
</svg>
