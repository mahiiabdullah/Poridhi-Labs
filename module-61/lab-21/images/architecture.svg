  <script type="application/ecmascript"><![CDATA[
    (function() {
      var svg = document.currentScript ? document.currentScript.ownerSVGElement : document.querySelector('svg');
      if (!svg) return;
      svg.querySelectorAll('line.arrow, path.arrow').forEach(function(el) {
        var drag = null;
        el.addEventListener('mousedown', function(e) {
          e.preventDefault();
          el.classList.add('dragging');
          var pt = svg.createSVGPoint();
          pt.x = e.clientX; pt.y = e.clientY;
          var ctm = svg.getScreenCTM().inverse();
          var p = pt.matrixTransform(ctm);
          drag = { startX: p.x, startY: p.y, orig: null };
          if (el.tagName.toLowerCase() === 'line') {
            drag.orig = { x1: +el.getAttribute('x1'), y1: +el.getAttribute('y1'),
                          x2: +el.getAttribute('x2'), y2: +el.getAttribute('y2') };
          } else {
            drag.orig = el.getAttribute('d');
          }
          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
        });
        function onMove(e) {
          if (!drag) return;
          var pt = svg.createSVGPoint();
          pt.x = e.clientX; pt.y = e.clientY;
          var ctm = svg.getScreenCTM().inverse();
          var p = pt.matrixTransform(ctm);
          var dx = p.x - drag.startX, dy = p.y - drag.startY;
          if (el.tagName.toLowerCase() === 'line') {
            el.setAttribute('x1', drag.orig.x1 + dx);
            el.setAttribute('y1', drag.orig.y1 + dy);
            el.setAttribute('x2', drag.orig.x2 + dx);
            el.setAttribute('y2', drag.orig.y2 + dy);
          } else {
            el.setAttribute('d', shiftPath(drag.orig, dx, dy));
          }
        }
        function onUp() {
          el.classList.remove('dragging');
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          drag = null;
        }
        function shiftPath(d, dx, dy) {
          return d.replace(/(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/g, function(_, a, b) {
            return (parseFloat(a) + dx).toFixed(2) + ',' + (parseFloat(b) + dy).toFixed(2);
          });
        }
      });
    })();
  ]]></script>
</svg>
